          import java.util.Collections;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.CopyOnWriteArrayList;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.locks.ReentrantReadWriteLock;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          import kotlin.Unit;

          /**
           * Runs yt-dlp (with its QuickJS engine for YouTube and FFmpeg for MP3 and merging),
           * which the youtubedl-android library bundles inside the app.
           */
          final class Engine {
              interface Listener {
                  void onEngine(String json);
              }

              interface InfoCallback {
                  void done(boolean ok, String json, String error);
              }

              private static final long DAY = 24L * 60 * 60 * 1000;
              private static final CopyOnWriteArrayList<Listener> listeners = new CopyOnWriteArrayList<>();
              private static final ExecutorService bg = Executors.newSingleThreadExecutor();
              private static final ExecutorService infoPool = Executors.newCachedThreadPool();
              // Downloads hold the read lock; updating yt-dlp takes the write lock, so the two never overlap.
              private static final ReentrantReadWriteLock rw = new ReentrantReadWriteLock();
              private static final Object initLock = new Object();
              private static final Set<String> cancelRequested = Collections.newSetFromMap(new ConcurrentHashMap<String, Boolean>());
              private static volatile boolean ready;
              private static volatile boolean started;
              private static volatile String state = "idle";
              private static volatile String message = "";
              private static volatile String version = "";
              private static volatile long lastCheck;

              private Engine() {
              }

              static void addListener(Listener l) {
                  listeners.add(l);
              }

              static void removeListener(Listener l) {
                  listeners.remove(l);
              }

              static String json() {
                  return U.obj("state", state, "message", message, "version", version, "lastCheck", lastCheck).toString();
              }

              private static void setState(String s, String msg) {
                  state = s;
                  message = msg == null ? "" : msg;
                  String j = json();
                  for (Listener l : listeners) l.onEngine(j);
              }

              private static SharedPreferences prefs(Context app) {
                  return app.getSharedPreferences("engine", Context.MODE_PRIVATE);
              }

              /** Unpacks the engine on first launch, then checks for a newer yt-dlp once a day. */
              static void prepareAsync(Context ctx) {
                  final Context app = ctx.getApplicationContext();
                  if (started) return;
                  started = true;
                  bg.execute(() -> {
                      try {
                          ensureReady(app);
                      } catch (Exception e) {
                          started = false;
                          return;
                      }
                      if (System.currentTimeMillis() - prefs(app).getLong("lastCheck", 0) > DAY) update(app, false);
                  });
              }

              static void ensureReady(Context app) throws Exception {
                  if (ready) return;
                  synchronized (initLock) {
                      if (ready) return;
                      setState("preparing", "Getting ready. The first launch takes up to a minute.");
                      try {
                          YoutubeDL.getInstance().init(app);
                          FFmpeg.getInstance().init(app);
                      } catch (Exception e) {
                          setState("error", "The downloader couldn't start (" + U.msg(e) + ").");
                          throw e;
                      }
                      version = readVersion(app);
                      lastCheck = prefs(app).getLong("lastCheck", 0);
                      ready = true;
                      setState("ready", "");
                  }
              }

              private static String readVersion(Context app) {
                  try {
                      String v = YoutubeDL.getInstance().version(app);
                      return v == null ? "" : v.trim();
                  } catch (Exception e) {
                      return "";
                  }
              }

              static void updateAsync(Context ctx, final boolean manual) {
                  final Context app = ctx.getApplicationContext();
                  bg.execute(() -> update(app, manual));
              }

              private static void update(Context app, boolean manual) {
                  if (!rw.writeLock().tryLock()) {
                      if (manual) setState(state, "Wait for your downloads to finish, then tap Update.");
                      return;
                  }
                  try {
                      ensureReady(app);
                      setState("updating", "Checking for a newer download engine…");
                      YoutubeDL.UpdateStatus st = YoutubeDL.getInstance().updateYoutubeDL(app, YoutubeDL.UpdateChannel._NIGHTLY);
                      lastCheck = System.currentTimeMillis();
                      prefs(app).edit().putLong("lastCheck", lastCheck).apply();
                      version = readVersion(app);
                      boolean updated = st == YoutubeDL.UpdateStatus.DONE;
                      setState("ready", updated ? "Updated to yt-dlp " + version + "." : (manual ? "You already have the newest engine." : ""));
                  } catch (Exception e) {
                      if (ready) setState("ready", manual ? "Couldn't update right now. Check your internet and try again." : "");
                  } finally {
                      rw.writeLock().unlock();
                  }
              }

              /** Reads a link's title, thumbnail and formats (yt-dlp -J). */
              static void fetchInfo(Context ctx, final String reqId, final String url, final InfoCallback cb) {
                  final Context app = ctx.getApplicationContext();
                  infoPool.execute(() -> {
                      boolean locked = false;
                      try {
                          rw.readLock().lock();
                          locked = true;
                          ensureReady(app);
                          YoutubeDLRequest r = new YoutubeDLRequest(url.trim());
                          r.addOption("-J");
                          r.addOption("--flat-playlist");
                          r.addOption("--no-playlist");
                          r.addOption("--no-warnings");
                          r.addOption("--remote-components", "ejs:github");
                          YoutubeDLResponse res = YoutubeDL.getInstance().execute(r, "info-" + reqId, false, null);
                          String out = res.getOut();
                          int a = out.indexOf('{');
                          int b = out.lastIndexOf('}');
                          if (a < 0 || b < a) throw new Exception(res.getErr());
                          cb.done(true, out.substring(a, b + 1), null);
                      } catch (Exception e) {
                          if (isCanceled(e)) cb.done(false, null, "cancelled");
                          else cb.done(false, null, Errors.friendly(U.msg(e)));
                      } finally {
                          if (locked) rw.readLock().unlock();
                      }
                  });
              }

              static void cancelInfo(String reqId) {
                  kill("info-" + reqId);
              }

              static void cancelJob(String id) {
                  String s = Jobs.status(id);
                  if ("waiting".equals(s)) {
                      Jobs.set(id, "status", "cancelled", "message", null);
                  } else if ("running".equals(s)) {
                      cancelRequested.add(id);
                      Jobs.set(id, "message", "Cancelling…", "dl", false);
                      kill(id);
                  }
              }

              private static void kill(String processId) {
                  try {
                      YoutubeDL.getInstance().destroyProcessById(processId);
                  } catch (Exception ignored) {
                  }
              }

              private static boolean isCanceled(Exception e) {
                  return e instanceof YoutubeDL.CanceledException;
              }

              /** Downloads one job (called on the download service's thread, one job at a time). */
              static void runJob(Context ctx, final String id) {
                  final Context app = ctx.getApplicationContext();
                  final JSONObject job = Jobs.copy(id);
                  if (job == null) return;
                  final File dir = new File(app.getCacheDir(), "jobs/" + id);
                  boolean locked = false;
                  try {
                      if (!rw.readLock().tryLock()) {
                          Jobs.set(id, "message", "Waiting for the engine update to finish…");
                          rw.readLock().lock();
                      }
                      locked = true;
                      ensureReady(app);
                      if (!Jobs.claim(id)) return;
                      U.deleteTree(dir);
                      if (!dir.mkdirs() && !dir.isDirectory()) {
                          throw new Exception("ERROR: Couldn't create a work folder. No space left on your phone?");
                      }
                      final Tracker t = new Tracker(id, job);
                      YoutubeDLRequest r = buildRequest(job, dir);
                      Exception failure = null;
                      String err = "";
                      try {
                          YoutubeDLResponse res = YoutubeDL.getInstance().execute(r, id, false, (p, eta, line) -> {
                              t.onLine(eta == null ? -1L : eta, line);
                              return Unit.INSTANCE;
                          });
                          err = res.getErr();
                      } catch (Exception e) {
                          failure = e;
                          err = U.msg(e);
                      }
                      if (cancelRequested.contains(id) || isCanceled(failure)) {
                          Jobs.set(id, "status", "cancelled", "message", null, "dl", false, "progress", 0);
                          return;
                      }
                      List<File> files = mediaIn(dir);
                      if (files.isEmpty()) {
                          Jobs.set(id, "status", "failed", "dl", false, "message", null, "error", Errors.friendly(err), "detail", Errors.tail(err));
                          return;
                      }
                      Jobs.set(id, "message", "Saving to your phone…", "dl", false, "progress", 100);
                      JSONArray saved = new JSONArray();
                      String folder = null;
                      StringBuilder saveErr = new StringBuilder();
                      for (File f : files) {
                          try {
                              JSONObject s = Saver.save(app, f, job.optString("kind"));
                              saved.put(s);
                              folder = s.optString("folder");
                          } catch (Exception e) {
                              saveErr.append("ERROR: Couldn't save ").append(f.getName()).append(": ").append(U.msg(e)).append('\n');
                          }
                      }
                      if (saved.length() == 0) {
                          Jobs.set(id, "status", "failed", "dl", false, "message", null,
                                  "error", "Couldn't save the file to your phone. Is the storage full?", "detail", Errors.tail(saveErr.toString()));
                          return;
                      }
                      String note = null;
                      if (job.optBoolean("playlist") && (failure != null || saveErr.length() > 0)) note = "Some items couldn't be downloaded";
                      else if (saveErr.length() > 0) note = "Some files couldn't be saved";
                      Jobs.set(id, "status", "done", "progress", 100, "dl", false, "files", saved, "folder", folder, "message", note,
                              "eta", null, "speed", null, "error", null, "detail", null, "item", null, "part", null);
                  } catch (Exception e) {
                      Jobs.set(id, "status", "failed", "dl", false, "message", null, "error", Errors.friendly(U.msg(e)), "detail", Errors.tail(U.msg(e)));
                  } finally {
                      cancelRequested.remove(id);
                      if (locked) rw.readLock().unlock();
                      U.deleteTree(dir);
                  }
              }

              private static YoutubeDLRequest buildRequest(JSONObject job, File dir) {
                  YoutubeDLRequest r = new YoutubeDLRequest(job.optString("url"));
                  boolean playlist = job.optBoolean("playlist");
                  String q = job.optString("quality", "best");
                  r.addOption(playlist ? "--yes-playlist" : "--no-playlist");
                  if (playlist) r.addOption("--ignore-errors");
                  r.addOption("-o", new File(dir, "%(title).150B.%(ext)s").getAbsolutePath());
                  r.addOption("--no-mtime");
                  r.addOption("--embed-metadata");
                  r.addOption("--concurrent-fragments", "4");
                  r.addOption("--retries", "5");
                  r.addOption("--fragment-retries", "5");
                  r.addOption("--remote-components", "ejs:github");
                  if ("audio".equals(job.optString("kind"))) {
                      r.addOption("-f", "ba/b");
                      r.addOption("-x");
                      r.addOption("--audio-format", "mp3");
                      r.addOption("--audio-quality", "128".equals(q) ? "128K" : "320K");
                      r.addOption("--embed-thumbnail");
                  } else {
                      // Highest quality up to the chosen size, preferring H.264 + AAC so it plays on every phone.
                      String res = q.matches("\\d+") ? "res:" + q : "res";
                      r.addOption("-f", "bv*+ba/b");
                      r.addOption("-S", res + ",+codec:avc:m4a");
                      r.addOption("--merge-output-format", "mp4");
                  }
                  return r;
              }

              /** The finished files yt-dlp left in the work folder (not partial pieces or thumbnails). */
              private static List<File> mediaIn(File dir) {
                  ArrayList<File> all = new ArrayList<>();
                  collect(dir, all);
                  ArrayList<File> out = new ArrayList<>();
                  for (File f : all) {
                      String n = f.getName().toLowerCase(Locale.ROOT);
                      if (f.length() == 0) continue;
                      if (n.endsWith(".part") || n.endsWith(".ytdl") || n.endsWith(".temp") || n.endsWith(".tmp")
                              || n.contains(".part-frag") || n.endsWith(".json") || n.endsWith(".description")
                              || n.endsWith(".vtt") || n.endsWith(".srt") || n.endsWith(".lrc")) continue;
                      if (n.endsWith(".jpg") || n.endsWith(".jpeg") || n.endsWith(".png") || n.endsWith(".webp")) continue;
                      // Separate video-only / sound-only pieces (Title.f137.mp4) left behind if joining them failed.
                      if (n.matches(".*\\.f\\d+(-\\d+)?\\.[a-z0-9]+$")) continue;
                      out.add(f);
                  }
                  Collections.sort(out, (a, b) -> a.getName().compareToIgnoreCase(b.getName()));
                  return out;
              }

              private static void collect(File f, List<File> into) {
                  File[] kids = f.listFiles();
                  if (kids == null) return;
                  for (File k : kids) {
                      if (k.isDirectory()) collect(k, into);
                      else into.add(k);
                  }
              }

              /** Follows yt-dlp's output and keeps the job's progress up to date. */
              private static final class Tracker {
                  private static final Pattern ITEM = Pattern.compile("Downloading item (\\d+) of (\\d+)");
                  private static final Pattern FORMATS = Pattern.compile("Downloading \\d+ format\\(s\\): (\\S+)");
                  private static final Pattern PROGRESS = Pattern.compile(
                          "^\\[download\\]\\s+([\\d.]+)%(?:\\s+of\\s+~?\\s*([\\d.]+\\s*[KMGT]?i?B))?(?:\\s+(?:at|in)\\s+(?:([\\d.]+\\s*[KMGT]?i?B/s)|[\\d:]+))?");
                  private final String id;
                  private int item = 1;
                  private int count;
                  private int stream;
                  private int streams = 1;
                  private float pct;
                  private long eta = -1;
                  private boolean dl;
                  private long lastPush;
                  private String phase = "Reading link…";
                  private String size = "";
                  private String speed = "";
                  private String part = "";

                  Tracker(String id, JSONObject job) {
                      this.id = id;
                      this.count = job.optBoolean("playlist") ? Math.max(0, job.optInt("count", 0)) : 0;
                  }

                  void onLine(long etaSec, String raw) {
                      if (cancelRequested.contains(id)) {
                          kill(id);
                          return;
                      }
                      String line = raw == null ? "" : raw.trim();
                      boolean force = false;
                      Matcher m;
                      if ((m = ITEM.matcher(line)).find()) {
                          item = U.toInt(m.group(1), item);
                          count = U.toInt(m.group(2), count);
                          stream = 0;
                          streams = 1;
                          pct = 0;
                          dl = false;
                          part = "";
                          phase = "Reading link…";
                          force = true;
                      } else if ((m = FORMATS.matcher(line)).find()) {
                          streams = Math.max(1, m.group(1).split("\\+").length);
                          stream = 0;
                      } else if (line.startsWith("[download] Destination:")) {
                          stream++;
                          if (stream > streams) streams = stream;
                          pct = 0;
                          dl = true;
                          part = streams > 1 ? (stream == 1 ? "video" : "sound") : "";
                          phase = "Downloading…";
                          force = true;
                      } else if ((m = PROGRESS.matcher(line)).find()) {
                          dl = true;
                          if (m.group(2) != null) size = m.group(2).replace(" ", "");
                          speed = m.group(3) != null ? m.group(3).replace(" ", "") : "";
                          try {
                              pct = Float.parseFloat(m.group(1));
                          } catch (NumberFormatException ignored) {
                          }
                          eta = etaSec;
                          if (pct >= 100) force = true;
                      } else if (line.startsWith("[ExtractAudio]")) {
                          phase = "Converting to MP3…";
                          dl = false;
                          force = true;
                      } else if (line.startsWith("[Merger]") || line.startsWith("[VideoRemuxer]") || line.startsWith("[VideoConvertor]")) {
                          phase = "Joining video and sound…";
                          dl = false;
                          force = true;
                      } else if (line.startsWith("[EmbedThumbnail]")) {
                          phase = "Adding cover art…";
                          dl = false;
                          force = true;
                      } else if (line.startsWith("[Metadata]")) {
                          phase = "Adding title and artist…";
                          dl = false;
                          force = true;
                      } else if (!dl && stream == 0 && (line.contains("[jsc") || line.contains("challenge"))) {
                          phase = "Unlocking the video. This can take a few seconds…";
                          force = true;
                      } else {
                          return;
                      }
                      long now = System.currentTimeMillis();
                      if (!force && now - lastPush < 500) return;
                      lastPush = now;
                      float within = Math.max(0f, Math.min(1f, pct / 100f));
                      int s = Math.max(1, stream);
                      float itemFrac = streams > 1 ? ((s - 1) + within) / streams : within;
                      if (!dl && stream > 0 && stream >= streams) itemFrac = 1f;
                      float total = count > 1 ? ((item - 1) + itemFrac) / count : itemFrac;
                      Jobs.set(id,
                              "progress", Math.round(total * 1000) / 10.0,
                              "dl", dl,
                              "message", phase,
                              "size", size,
                              "speed", speed,
                              "eta", dl && eta > 0 ? eta : null,
                              "item", count > 1 ? item : null,
                              "count", count > 1 ? count : null,
                              "part", part);
                  }
              }
          }
