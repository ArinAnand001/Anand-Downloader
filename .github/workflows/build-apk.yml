          package com.anand.downloader;

          import org.json.JSONException;
          import org.json.JSONObject;

          import java.io.File;

          /** Small helpers shared by the other classes. */
          final class U {
              private U() {
              }

              static JSONObject obj(Object... kv) {
                  JSONObject o = new JSONObject();
                  for (int i = 0; i + 1 < kv.length; i += 2) put(o, String.valueOf(kv[i]), kv[i + 1]);
                  return o;
              }

              static void put(JSONObject o, String key, Object value) {
                  try {
                      o.put(key, value == null ? JSONObject.NULL : value);
                  } catch (JSONException ignored) {
                  }
              }

              static String msg(Throwable e) {
                  if (e == null) return "";
                  String m = e.getMessage();
                  return m == null || m.trim().isEmpty() ? e.getClass().getSimpleName() : m;
              }

              static int toInt(String s, int fallback) {
                  try {
                      return Integer.parseInt(s.trim());
                  } catch (Exception e) {
                      return fallback;
                  }
              }

              static void deleteTree(File f) {
                  if (f == null || !f.exists()) return;
                  File[] kids = f.listFiles();
                  if (kids != null) for (File k : kids) deleteTree(k);
                  //noinspection ResultOfMethodCallIgnored
                  f.delete();
              }
          }
