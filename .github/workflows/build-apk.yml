# Builds the downloader app (APK) from the zip you upload to this repository.
#
# How to use:
#   1. Keep this file at .github/workflows/build-apk.yml
#   2. Upload the app zip (the one with index.html inside). Don't unzip it.
#   3. Wait for the green tick in the Actions tab (about 10 minutes the first time, faster after).
#   4. Download the app on your phone:
#        https://github.com/YOUR-USERNAME/YOUR-REPO/releases/latest/download/Fetch.apk
#      Older 32-bit phones that say "App not installed" use Fetch-32bit.apk instead.
#
# Public repository: first add a secret named KEYSTORE_PASSWORD
# (Settings > Secrets and variables > Actions > Secrets). Without it, updates won't install over the old app.
#
# To rename the app, change APP_NAME below. Keep APP_ID the same, so it installs as an update.

name: Build Android app

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

env:
  APP_NAME: Specter Downloader                # name under the app icon, the folder in Music/ and Movies/, and the APK file name
  APP_ID: com.anand.downloader   # Android's id for the app. Changing it makes a separate app.
  YTDL_ANDROID: 0.18.1           # youtubedl-android: yt-dlp, Python, FFmpeg and QuickJS packed for Android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and unzip your app
        id: web
        run: |
          set -euo pipefail
          # Use the zip that was committed most recently.
          ZIP=""
          while IFS= read -r f; do
            if [ -n "$f" ] && [ -f "$f" ]; then ZIP="$f"; break; fi
          done < <(git log --format= --name-only --diff-filter=AM -- '*.zip' | awk 'NF && !seen[$0]++')
          if [ -z "$ZIP" ]; then
            ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -n1 || true)
          fi
          if [ -z "$ZIP" ]; then
            echo "::warning::No zip file found yet. Upload the app zip to this repository and the build starts by itself."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using $ZIP"
          rm -rf "$RUNNER_TEMP/web_src" && mkdir -p "$RUNNER_TEMP/web_src"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/web_src"
          IDX=$(find "$RUNNER_TEMP/web_src" -name index.html -not -path '*/__MACOSX/*' | awk '{ print length($0) " " $0 }' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "$IDX" ]; then
            echo "::error::The zip $ZIP has no index.html inside, so there is no app to build."
            exit 1
          fi
          WEB=$(dirname "$IDX")
          rm -rf web && mkdir web && cp -R "$WEB"/. web/
          rm -rf web/__MACOSX
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Set up Java and Gradle
        if: steps.web.outputs.found == 'true'
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"; fi
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Reuse files downloaded by earlier builds
        if: steps.web.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('.github/workflows/build-apk.yml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Create the Android project
        if: steps.web.outputs.found == 'true'
        run: |
          set -euo pipefail
          A=android
          M=$A/app/src/main
          J=$M/java/com/anand/downloader
          R=$M/res
          rm -rf $A
          mkdir -p $J $M/assets/www $R/values $R/values-night $R/values-v27 $R/values-night-v27 $R/drawable $R/mipmap-xxxhdpi $R/mipmap-anydpi-v26
          cp -R web/. $M/assets/www/
          echo "sdk.dir=$ANDROID_HOME" > $A/local.properties

          cat > $A/settings.gradle <<'EOF_SETTINGS'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'Downloader'
          include ':app'
          EOF_SETTINGS

          cat > $A/build.gradle <<'EOF_ROOT'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF_ROOT

          cat > $A/gradle.properties <<'EOF_PROPS'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_PROPS

          cat > $A/app/build.gradle <<'EOF_APP'
          plugins {
              id 'com.android.application'
          }

          def buildNumber = System.getenv('VERSION_CODE') ?: '1'
          def ytdl = System.getenv('YTDL_ANDROID') ?: '0.18.1'

          android {
              namespace 'com.anand.downloader'
              compileSdk 35

              defaultConfig {
                  applicationId(System.getenv('APP_ID') ?: 'com.anand.downloader')
                  minSdk 26
                  targetSdk 34
                  versionCode(Integer.parseInt(buildNumber))
                  versionName('1.' + buildNumber)
              }

              // One APK for modern 64-bit phones and one for older 32-bit phones, instead of a single huge one.
              splits {
                  abi {
                      enable true
                      reset()
                      include 'arm64-v8a', 'armeabi-v7a'
                      universalApk false
                  }
              }

              signingConfigs {
                  release {
                      storeFile(file(System.getenv('KEYSTORE_PATH')))
                      storePassword(System.getenv('KEYSTORE_PASSWORD'))
                      keyAlias('app')
                      keyPassword(System.getenv('KEYSTORE_PASSWORD'))
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              // yt-dlp, Python, FFmpeg and QuickJS run as programs, so Android must unpack them on install.
              packaging {
                  jniLibs {
                      useLegacyPackaging true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
              implementation "io.github.junkfood02.youtubedl-android:library:${ytdl}"
              implementation "io.github.junkfood02.youtubedl-android:ffmpeg:${ytdl}"
          }
          EOF_APP

          cat > $M/AndroidManifest.xml <<'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density|fontScale"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".DownloadService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF_MANIFEST

          cat > $J/MainActivity.java <<'EOF_JAVA1'
          package com.anand.downloader;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          import org.json.JSONArray;
          import org.json.JSONException;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.Map;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity implements Jobs.Listener, Engine.Listener {
              // The screens are packed inside the APK and served from this address.
              private static final String HOST = "appassets.androidplatform.net";
              private static final String START_URL = "https://" + HOST + "/assets/www/index.html";
              private static final Pattern LINK = Pattern.compile("https?://[^\\s<>\"']+", Pattern.CASE_INSENSITIVE);

              private WebView web;
              private final Handler main = new Handler(Looper.getMainLooper());
              private final Map<String, String> infoResults = new ConcurrentHashMap<>();
              private volatile String pendingUrl;
              private volatile boolean pageReady;
              private boolean askedPermissions;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Jobs.load(this);
                  Engine.prepareAsync(this);

                  web = new WebView(this);
                  setContentView(web);
                  final WebViewAssetLoader assets = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  web.addJavascriptInterface(new Bridge(), "Native");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assets.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if (HOST.equals(u.getHost())) return false;
                          openExternal(u);
                          return true;
                      }
                  });

                  Jobs.addListener(this);
                  Engine.addListener(this);
                  handleIntent(getIntent());
                  web.loadUrl(START_URL);
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIntent(intent);
              }

              /** A link shared from YouTube, Instagram or any other app. */
              private void handleIntent(Intent intent) {
                  if (intent == null || !Intent.ACTION_SEND.equals(intent.getAction())) return;
                  CharSequence cs = intent.getCharSequenceExtra(Intent.EXTRA_TEXT);
                  if (cs == null) return;
                  Matcher m = LINK.matcher(cs);
                  if (!m.find()) {
                      emit(U.obj("type", "toast", "text", "There was no link in what you shared.").toString());
                      return;
                  }
                  String url = m.group();
                  if (pageReady) emit(U.obj("type", "shared", "url", url).toString());
                  else pendingUrl = url;
              }

              private void emit(final String json) {
                  main.post(() -> {
                      if (web != null) web.evaluateJavascript("window.onNative&&window.onNative(" + json + ")", null);
                  });
              }

              private void toast(String text) {
                  emit(U.obj("type", "toast", "text", text).toString());
              }

              @Override
              public void onJob(String json) {
                  emit("{\"type\":\"job\",\"job\":" + json + "}");
              }

              @Override
              public void onRemoved(String id) {
                  emit("{\"type\":\"jobRemoved\",\"id\":" + JSONObject.quote(id) + "}");
              }

              @Override
              public void onEngine(String json) {
                  emit("{\"type\":\"engine\",\"engine\":" + json + "}");
              }

              private void startDownloads() {
                  try {
                      startForegroundService(new Intent(this, DownloadService.class));
                  } catch (Exception e) {
                      toast("Couldn't start the download: " + U.msg(e));
                  }
              }

              private void askPermissionsOnce() {
                  if (askedPermissions) return;
                  askedPermissions = true;
                  ArrayList<String> need = new ArrayList<>();
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      need.add("android.permission.POST_NOTIFICATIONS");
                  }
                  if (Build.VERSION.SDK_INT < 29 && checkSelfPermission("android.permission.WRITE_EXTERNAL_STORAGE") != PackageManager.PERMISSION_GRANTED) {
                      need.add("android.permission.WRITE_EXTERNAL_STORAGE");
                  }
                  if (!need.isEmpty()) requestPermissions(need.toArray(new String[0]), 7);
              }

              private void openExternal(Uri u) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, u));
                  } catch (Exception ignored) {
                  }
              }

              private String appVersion() {
                  try {
                      return getPackageManager().getPackageInfo(getPackageName(), 0).versionName;
                  } catch (Exception e) {
                      return "";
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (web == null) {
                      super.onBackPressed();
                      return;
                  }
                  web.evaluateJavascript("window.handleBack?window.handleBack():false", v -> {
                      if (!"true".equals(v)) moveTaskToBack(true);
                  });
              }

              @Override
              protected void onDestroy() {
                  Jobs.removeListener(this);
                  Engine.removeListener(this);
                  if (web != null) {
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }

              /** What the screens (index.html) can ask the app to do. */
              private class Bridge {
                  @JavascriptInterface
                  public String getState() {
                      JSONObject o = new JSONObject();
                      try {
                          o.put("appName", getString(R.string.app_name));
                          o.put("engine", new JSONObject(Engine.json()));
                          o.put("jobs", new JSONArray(Jobs.listJson()));
                          o.put("musicDir", Saver.folderLabel(MainActivity.this, "audio"));
                          o.put("videoDir", Saver.folderLabel(MainActivity.this, "video"));
                          o.put("appVersion", appVersion());
                          o.put("sdk", Build.VERSION.SDK_INT);
                          String p = pendingUrl;
                          pendingUrl = null;
                          if (p != null) o.put("pendingUrl", p);
                      } catch (JSONException ignored) {
                      }
                      pageReady = true;
                      return o.toString();
                  }

                  @JavascriptInterface
                  public void fetchInfo(final String reqId, final String url) {
                      Engine.fetchInfo(MainActivity.this, reqId, url, (ok, json, error) -> {
                          if (ok) infoResults.put(reqId, json);
                          emit(U.obj("type", "info", "reqId", reqId, "ok", ok, "error", error).toString());
                      });
                  }

                  @JavascriptInterface
                  public String takeInfo(String reqId) {
                      String r = infoResults.remove(reqId);
                      return r == null ? "" : r;
                  }

                  @JavascriptInterface
                  public void cancelInfo(String reqId) {
                      Engine.cancelInfo(reqId);
                      infoResults.remove(reqId);
                  }

                  @JavascriptInterface
                  public String download(String specJson) {
                      try {
                          String id = Jobs.add(new JSONObject(specJson));
                          main.post(() -> {
                              askPermissionsOnce();
                              startDownloads();
                          });
                          return id;
                      } catch (JSONException e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public void cancel(String id) {
                      Engine.cancelJob(id);
                  }

                  @JavascriptInterface
                  public void retry(String id) {
                      if (Jobs.retry(id)) main.post(MainActivity.this::startDownloads);
                  }

                  @JavascriptInterface
                  public String open(final String id) {
                      main.post(() -> {
                          if (!Saver.open(MainActivity.this, Jobs.copy(id))) {
                              toast("Couldn't open it. The file may have been moved or deleted.");
                          }
                      });
                      return "";
                  }

                  @JavascriptInterface
                  public void share(final String id) {
                      main.post(() -> {
                          if (!Saver.share(MainActivity.this, Jobs.copy(id))) toast("Couldn't share this file.");
                      });
                  }

                  @JavascriptInterface
                  public String remove(String id, String deleteFile) {
                      JSONObject j = Jobs.copy(id);
                      if (j == null) return "";
                      String st = j.optString("status");
                      if ("running".equals(st) || "waiting".equals(st)) Engine.cancelJob(id);
                      String msg = "Removed from the list";
                      if ("1".equals(deleteFile)) {
                          msg = Saver.delete(MainActivity.this, j)
                                  ? "Deleted from your phone"
                                  : "Removed from the list. Some files couldn't be deleted, or were already gone.";
                      }
                      Jobs.remove(id);
                      return msg;
                  }

                  @JavascriptInterface
                  public void clearFinished() {
                      Jobs.clearFinished();
                  }

                  @JavascriptInterface
                  public String paste() {
                      try {
                          ClipboardManager cm = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                          ClipData c = cm == null ? null : cm.getPrimaryClip();
                          if (c == null || c.getItemCount() == 0) return "";
                          CharSequence t = c.getItemAt(0).coerceToText(MainActivity.this);
                          return t == null ? "" : t.toString();
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public void updateEngine() {
                      Engine.updateAsync(MainActivity.this, true);
                  }

                  @JavascriptInterface
                  public void openUrl(final String url) {
                      main.post(() -> openExternal(Uri.parse(url)));
                  }
              }
          }
          EOF_JAVA1

          cat > $J/DownloadService.java <<'EOF_JAVA2'
          package com.anand.downloader;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;

          import org.json.JSONException;
          import org.json.JSONObject;

          /** Keeps downloads going when the app is in the background, with a progress notification. */
          public class DownloadService extends Service implements Jobs.Listener {
              static final String ACTION_CANCEL = "com.anand.downloader.CANCEL";
              static final String EXTRA_ID = "id";
              private static final String CH_PROGRESS = "progress";
              private static final String CH_DONE = "finished";
              private static final int NOTE_ID = 4101;

              private final Handler main = new Handler(Looper.getMainLooper());
              private boolean running; // guarded by this
              private volatile String currentId;
              private volatile long lastNoteAt;
              private NotificationManager nm;
              private PowerManager.WakeLock wake;

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  NotificationChannel a = new NotificationChannel(CH_PROGRESS, "Downloads in progress", NotificationManager.IMPORTANCE_LOW);
                  a.setShowBadge(false);
                  nm.createNotificationChannel(a);
                  nm.createNotificationChannel(new NotificationChannel(CH_DONE, "Finished downloads", NotificationManager.IMPORTANCE_DEFAULT));
                  Jobs.load(this);
                  Jobs.addListener(this);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_CANCEL.equals(intent.getAction())) {
                      String id = intent.getStringExtra(EXTRA_ID);
                      if (id != null) Engine.cancelJob(id);
                      synchronized (this) {
                          if (!running) stopSelf(startId);
                      }
                      return START_NOT_STICKY;
                  }
                  try {
                      Notification n = progressNote(null, "Getting ready…", null, -1);
                      if (Build.VERSION.SDK_INT >= 29) startForeground(NOTE_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);
                      else startForeground(NOTE_ID, n);
                  } catch (Exception ignored) {
                  }
                  synchronized (this) {
                      if (!running) {
                          running = true;
                          new Thread(this::work, "downloads").start();
                      }
                  }
                  return START_NOT_STICKY;
              }

              private void work() {
                  holdWake(true);
                  try {
                      while (true) {
                          String id;
                          synchronized (this) {
                              id = Jobs.nextWaiting();
                              if (id == null) {
                                  running = false;
                                  break;
                              }
                          }
                          currentId = id;
                          lastNoteAt = 0;
                          try {
                              Engine.runJob(this, id);
                          } catch (Throwable t) {
                              Jobs.set(id, "status", "failed", "dl", false, "error", "Something went wrong: " + U.msg(t));
                          }
                          currentId = null;
                          finishedNote(id);
                      }
                  } finally {
                      synchronized (this) {
                          running = false;
                      }
                      currentId = null;
                      holdWake(false);
                      main.post(this::stopIfIdle);
                  }
              }

              private void stopIfIdle() {
                  synchronized (this) {
                      if (running) return;
                  }
                  stopForeground(STOP_FOREGROUND_REMOVE);
                  stopSelf();
              }

              private void holdWake(boolean on) {
                  try {
                      if (on) {
                          PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                          wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "downloader:work");
                          wake.acquire(3 * 60 * 60 * 1000L);
                      } else if (wake != null && wake.isHeld()) {
                          wake.release();
                      }
                  } catch (Exception ignored) {
                  }
              }

              private PendingIntent openApp() {
                  Intent i = new Intent(this, MainActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  return PendingIntent.getActivity(this, 0, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              @SuppressWarnings("deprecation")
              private Notification progressNote(String id, String title, String text, int pct) {
                  Notification.Builder b = new Notification.Builder(this, CH_PROGRESS)
                          .setSmallIcon(R.drawable.ic_stat_download)
                          .setContentTitle(title)
                          .setOngoing(true)
                          .setOnlyAlertOnce(true)
                          .setShowWhen(false)
                          .setCategory(Notification.CATEGORY_PROGRESS)
                          .setContentIntent(openApp());
                  if (text != null) b.setContentText(text);
                  if (pct < 0) b.setProgress(100, 0, true);
                  else b.setProgress(100, pct, false);
                  if (Build.VERSION.SDK_INT >= 31) b.setForegroundServiceBehavior(Notification.FOREGROUND_SERVICE_IMMEDIATE);
                  if (id != null) {
                      Intent cancel = new Intent(this, DownloadService.class).setAction(ACTION_CANCEL).putExtra(EXTRA_ID, id);
                      PendingIntent pi = PendingIntent.getService(this, 1, cancel, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                      b.addAction(new Notification.Action.Builder(R.drawable.ic_stat_download, "Cancel", pi).build());
                  }
                  return b.build();
              }

              @Override
              public void onJob(String json) {
                  String cur = currentId;
                  if (cur == null) return;
                  long now = System.currentTimeMillis();
                  if (now - lastNoteAt < 1000) return;
                  try {
                      JSONObject j = new JSONObject(json);
                      if (!cur.equals(j.optString("id")) || !"running".equals(j.optString("status"))) return;
                      lastNoteAt = now;
                      String text;
                      int pct = (int) Math.floor(j.optDouble("progress", 0));
