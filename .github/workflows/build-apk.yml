      - name: Prepare the signing key
        if: steps.web.outputs.found == 'true'
        env:
          SECRET_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          PASS="${SECRET_PASSWORD:-downloader-release-key}"
          KS="signing/release.keystore"
          if [ -f "$KS" ]; then
            echo "Using the saved signing key, so this version installs over the old one."
          elif [ "$IS_PRIVATE" != "true" ] && [ -z "$SECRET_PASSWORD" ]; then
            echo "::warning::This repository is public and has no KEYSTORE_PASSWORD secret, so the signing key was not saved. Add the secret (Settings > Secrets and variables > Actions) and run this again. Until then, each new build needs the old app uninstalled first."
            KS="$RUNNER_TEMP/temp.keystore"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias app -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=${APP_NAME}, O=Personal"
          else
            mkdir -p signing
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias app -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=${APP_NAME}, O=Personal"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$KS"
            git commit -m "Save the app signing key so future builds install as updates"
            BRANCH="${GITHUB_REF_NAME}"
            ok=false
            for i in 1 2 3; do
              if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then ok=true; break; fi
              sleep 5
            done
            if [ "$ok" != "true" ]; then
              echo "::error::Could not save the signing key to the repository. Run the build again."
              exit 1
            fi
            echo "Created and saved a new signing key in $KS."
          fi
          case "$KS" in /*) KP="$KS" ;; *) KP="$GITHUB_WORKSPACE/$KS" ;; esac
          echo "KEYSTORE_PATH=$KP" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build the APK
        if: steps.web.outputs.found == 'true'
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace
          OUT=android/app/build/outputs/apk/release
          ls -la "$OUT"
          cp "$OUT/app-arm64-v8a-release.apk" "${APP_NAME}.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "${APP_NAME}-32bit.apk"
          ls -la "${APP_NAME}.apk" "${APP_NAME}-32bit.apk"

      - name: Publish the download
        if: steps.web.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.web.outputs.zip }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          LINK="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${APP_NAME}.apk"
          NOTES=$(printf 'Built from `%s`.\n\nInstall: open this page on your Android phone, tap **%s.apk**, then tap Install. If Android asks, allow installs from this source.\n\nOlder 32-bit phones that say "App not installed": use **%s-32bit.apk** instead.\n\nThis version installs over the previous one.' "$ZIP" "$APP_NAME" "$APP_NAME")
          gh release create "$TAG" "${APP_NAME}.apk" "${APP_NAME}-32bit.apk" --title "${APP_NAME} build ${GITHUB_RUN_NUMBER}" --notes "$NOTES" --latest --target "$(git rev-parse HEAD)"
          # keep the five newest builds
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' | while read -r old; do
            [ -n "$old" ] && gh release delete "$old" --yes --cleanup-tag || true
          done
          {
            echo "## Your app is ready"
            echo ""
            echo "Download on your phone: $LINK"
            echo ""
            echo "Older 32-bit phones: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${APP_NAME}-32bit.apk"
          } >> "$GITHUB_STEP_SUMMARY"
