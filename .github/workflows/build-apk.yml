          package com.anand.downloader;

          import java.util.ArrayList;
          import java.util.Locale;

          /** Turns yt-dlp's error output into a sentence a person can act on. */
          final class Errors {
              private Errors() {
              }

              static String friendly(String raw) {
                  if (raw == null) raw = "";
                  String low = raw.toLowerCase(Locale.ROOT);
                  if (low.contains("not a bot")) {
                      return "YouTube wants to check that you're not a bot. Wait a few minutes and try again, or switch between Wi-Fi and mobile data.";
                  }
                  if (low.contains("unsupported url")) {
                      return "This website isn't supported, or the link doesn't point to a video or song.";
                  }
                  if (low.contains("private video")) return "This video is private.";
                  if (low.contains("video unavailable") || low.contains("has been removed") || low.contains("no longer available")) {
                      return "This video isn't available. It may be private, deleted or blocked.";
                  }
                  if (low.contains("conversion failed") || low.contains("postprocessing")) {
                      return "The file downloaded but couldn't be converted. Tap Try again, or pick Video instead.";
                  }
                  if (low.contains("confirm your age") || low.contains("age-restricted") || low.contains("age restricted")) {
                      return "This video is age-restricted, so it needs a login, which this app can't do yet.";
                  }
                  if (low.contains("login required") || low.contains("log in") || low.contains("sign in to")
                          || low.contains("registered users") || low.contains("use --cookies")) {
                      return "This site only shows this to logged-in users, which this app can't do yet.";
                  }
                  if (low.contains("not available in your country") || low.contains("geo restrict") || low.contains("geo-restrict")) {
                      return "This isn't available in your country.";
                  }
                  if (low.contains("requested format is not available")) {
                      return "That quality isn't available for this link. Pick another one.";
                  }
                  if (low.contains("drm")) return "This is DRM-protected, so it can't be downloaded.";
                  if (low.contains("live event") || low.contains("premieres in") || low.contains("is live")) {
                      return "This is a live stream or premiere that hasn't finished yet.";
                  }
                  if (low.contains("no space left")) return "Your phone is out of storage space.";
                  if (low.contains("http error 404")) return "Nothing was found at this link. It may have been deleted.";
                  if (low.contains("http error 403") || low.contains("forbidden")) {
                      return "The site blocked the download. Open Settings, tap Update, then try again.";
                  }
                  if (low.contains("unable to download webpage") || low.contains("failed to resolve")
                          || low.contains("name or service not known") || low.contains("network is unreachable")
                          || low.contains("timed out") || low.contains("connection reset") || low.contains("connection refused")
                          || low.contains("temporary failure in name resolution")) {
                      return "Couldn't reach the site. Check your internet connection and try again.";
                  }
                  if (low.contains("no video formats found") || low.contains("no media found")) {
                      return "There's no video or sound at this link.";
                  }
                  String last = "";
                  for (String line : raw.split("\n")) {
                      String l = line.trim();
                      if (l.startsWith("ERROR:")) last = l.substring(6).trim();
                  }
                  if (last.isEmpty()) {
                      for (String line : raw.split("\n")) if (!line.trim().isEmpty()) last = line.trim();
                  }
                  last = last.replaceFirst("^\\[[^\\]]+\\]\\s*[^:]*:\\s*", "");
                  if (last.isEmpty()) return "Something went wrong. Tap Try again, or update the engine in Settings.";
                  if (last.length() > 220) last = last.substring(0, 220) + "…";
                  return last;
              }

              /** The last few meaningful lines, shown under "details" so a screenshot explains the problem. */
              static String tail(String raw) {
                  if (raw == null) return "";
                  ArrayList<String> keep = new ArrayList<>();
                  for (String line : raw.split("\n")) {
                      String l = line.trim();
                      if (!l.isEmpty()) keep.add(l);
                  }
                  int from = Math.max(0, keep.size() - 8);
                  StringBuilder b = new StringBuilder();
                  for (int i = from; i < keep.size(); i++) b.append(keep.get(i)).append('\n');
                  String s = b.toString().trim();
                  return s.length() > 1500 ? s.substring(s.length() - 1500) : s;
              }
          }
