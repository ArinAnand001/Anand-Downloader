          package com.anand.downloader;

          import android.content.Context;
          import android.content.SharedPreferences;

          import org.json.JSONArray;
          import org.json.JSONException;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.Random;
          import java.util.concurrent.CopyOnWriteArrayList;

          /** The list of downloads, saved on the phone so it survives restarts. */
          final class Jobs {
              interface Listener {
                  void onJob(String json);

                  void onRemoved(String id);
              }

              private static final String[] SPEC_KEYS = {
                      "url", "title", "thumb", "uploader", "site", "kind", "quality", "label", "playlist", "count", "duration", "sizeHint"
              };
              private static final int MAX = 300;
              private static final ArrayList<JSONObject> list = new ArrayList<>();
              private static final CopyOnWriteArrayList<Listener> listeners = new CopyOnWriteArrayList<>();
              private static final Random rnd = new Random();
              private static SharedPreferences prefs;
              private static boolean loaded;

              private Jobs() {
              }

              static void addListener(Listener l) {
                  listeners.add(l);
              }

              static void removeListener(Listener l) {
                  listeners.remove(l);
              }

              static synchronized void load(Context ctx) {
                  if (loaded) return;
                  loaded = true;
                  prefs = ctx.getApplicationContext().getSharedPreferences("jobs", Context.MODE_PRIVATE);
                  try {
                      JSONArray a = new JSONArray(prefs.getString("list", "[]"));
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject j = a.optJSONObject(i);
                          if (j == null) continue;
                          String s = j.optString("status");
                          if ("running".equals(s) || "waiting".equals(s)) {
                              // The app was closed while this was going on.
                              U.put(j, "status", "failed");
                              U.put(j, "error", "Stopped because the app was closed. Tap to try again.");
                              j.remove("dl");
                              j.remove("message");
                          }
                          list.add(j);
                      }
                  } catch (JSONException ignored) {
                  }
              }

              private static JSONObject find(String id) {
                  if (id == null) return null;
                  for (JSONObject j : list) if (id.equals(j.optString("id"))) return j;
                  return null;
              }

              static synchronized String add(JSONObject spec) {
                  String id = "j" + Long.toString(System.currentTimeMillis(), 36) + Integer.toString(1296 + rnd.nextInt(45000), 36);
                  JSONObject j = new JSONObject();
                  for (String k : SPEC_KEYS) {
                      Object v = spec.opt(k);
                      if (v != null && v != JSONObject.NULL) U.put(j, k, v);
                  }
                  U.put(j, "id", id);
                  U.put(j, "status", "waiting");
                  U.put(j, "progress", 0);
                  U.put(j, "created", System.currentTimeMillis());
                  list.add(0, j);
                  for (int i = list.size() - 1; i >= 0 && list.size() > MAX; i--) {
                      String s = list.get(i).optString("status");
                      if (!"running".equals(s) && !"waiting".equals(s)) list.remove(i);
                  }
                  save();
                  fire(j);
                  return id;
              }

              static synchronized JSONObject copy(String id) {
                  JSONObject j = find(id);
                  if (j == null) return null;
                  try {
                      return new JSONObject(j.toString());
                  } catch (JSONException e) {
                      return null;
                  }
              }

              static synchronized String status(String id) {
                  JSONObject j = find(id);
                  return j == null ? null : j.optString("status");
              }

              /** Sets fields on a job. A null value removes the field. */
              static synchronized void set(String id, Object... kv) {
                  JSONObject j = find(id);
                  if (j == null) return;
                  boolean important = false;
                  for (int i = 0; i + 1 < kv.length; i += 2) {
                      String k = String.valueOf(kv[i]);
                      Object v = kv[i + 1];
                      if ("status".equals(k) && !String.valueOf(v).equals(j.optString("status"))) important = true;
                      if ("files".equals(k) || "error".equals(k)) important = true;
                      if (v == null) j.remove(k);
                      else U.put(j, k, v);
                  }
                  if (important) save();
                  fire(j);
              }

              /** Moves a waiting job to running. Returns false if it was cancelled or removed meanwhile. */
              static synchronized boolean claim(String id) {
                  JSONObject j = find(id);
                  if (j == null || !"waiting".equals(j.optString("status"))) return false;
                  U.put(j, "status", "running");
                  U.put(j, "progress", 0);
                  U.put(j, "message", "Reading link…");
                  j.remove("error");
                  j.remove("detail");
                  save();
                  fire(j);
                  return true;
              }

              static synchronized String nextWaiting() {
                  for (int i = list.size() - 1; i >= 0; i--) {
                      JSONObject j = list.get(i);
                      if ("waiting".equals(j.optString("status"))) return j.optString("id");
                  }
                  return null;
              }

              static synchronized boolean retry(String id) {
                  JSONObject j = find(id);
                  if (j == null) return false;
                  String s = j.optString("status");
                  if (!"failed".equals(s) && !"cancelled".equals(s)) return false;
                  for (String k : new String[]{"error", "detail", "message", "dl", "speed", "size", "eta", "item", "part"}) j.remove(k);
                  U.put(j, "status", "waiting");
                  U.put(j, "progress", 0);
                  save();
                  fire(j);
                  return true;
              }

              static synchronized void remove(String id) {
                  JSONObject j = find(id);
                  if (j == null) return;
                  list.remove(j);
                  save();
                  for (Listener l : listeners) l.onRemoved(id);
              }

              static synchronized void clearFinished() {
                  ArrayList<String> gone = new ArrayList<>();
                  Iterator<JSONObject> it = list.iterator();
                  while (it.hasNext()) {
                      JSONObject j = it.next();
                      String s = j.optString("status");
                      if ("done".equals(s) || "failed".equals(s) || "cancelled".equals(s)) {
                          gone.add(j.optString("id"));
                          it.remove();
                      }
                  }
                  save();
                  for (String id : gone) for (Listener l : listeners) l.onRemoved(id);
              }

              static synchronized String listJson() {
                  JSONArray a = new JSONArray();
                  for (JSONObject j : list) a.put(j);
                  return a.toString();
              }

              private static void save() {
                  if (prefs == null) return;
                  JSONArray a = new JSONArray();
                  for (JSONObject j : list) a.put(j);
                  prefs.edit().putString("list", a.toString()).apply();
              }

              private static void fire(JSONObject j) {
                  String s = j.toString();
                  for (Listener l : listeners) l.onJob(s);
              }
          }
          EOF_JAVA4

          cat > $J/Saver.java <<'EOF_JAVA5'
          package com.anand.downloader;

          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.database.Cursor;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.MimeTypeMap;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.Locale;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.TimeUnit;

          /** Puts finished files where other apps can find them: Music/<App> and Movies/<App>. */
          final class Saver {
              private Saver() {
              }

              static String folderName(Context c) {
                  String n = c.getString(R.string.app_name).replaceAll("[\\\\/:*?\"<>|]", "").trim();
                  return n.isEmpty() ? "Downloads" : n;
              }

              static String folderLabel(Context c, String kind) {
                  return ("audio".equals(kind) ? Environment.DIRECTORY_MUSIC : Environment.DIRECTORY_MOVIES) + "/" + folderName(c);
              }

              static String mimeOf(String name, String kind) {
                  int dot = name.lastIndexOf('.');
                  String ext = dot >= 0 ? name.substring(dot + 1).toLowerCase(Locale.ROOT) : "";
                  switch (ext) {
                      case "mp3":
                          return "audio/mpeg";
                      case "m4a":
                      case "aac":
                          return "audio/mp4";
                      case "opus":
                      case "ogg":
                      case "oga":
                          return "audio/ogg";
                      case "flac":
                          return "audio/flac";
                      case "wav":
                          return "audio/wav";
                      case "mp4":
                      case "m4v":
                          return "video/mp4";
                      case "mkv":
                          return "video/x-matroska";
                      case "webm":
                          return "audio".equals(kind) ? "audio/webm" : "video/webm";
                      case "mov":
                          return "video/quicktime";
                      case "3gp":
                          return "video/3gpp";
                      default:
                          String m = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext);
                          return m != null ? m : "application/octet-stream";
                  }
              }

              @SuppressWarnings("deprecation")
              static JSONObject save(Context c, File f, String kind) throws Exception {
                  String name = f.getName();
                  String mime = mimeOf(name, kind);
                  long bytes = f.length();
                  String top;
                  if (mime.startsWith("audio/")) top = Environment.DIRECTORY_MUSIC;
                  else if (mime.startsWith("video/")) top = Environment.DIRECTORY_MOVIES;
                  else if (mime.startsWith("image/")) top = Environment.DIRECTORY_PICTURES;
                  else top = Environment.DIRECTORY_DOWNLOADS;
                  String folder = top + "/" + folderName(c);

                  if (Build.VERSION.SDK_INT >= 29) {
                      String vol = MediaStore.VOLUME_EXTERNAL_PRIMARY;
                      Uri collection;
                      if (mime.startsWith("audio/")) collection = MediaStore.Audio.Media.getContentUri(vol);
                      else if (mime.startsWith("video/")) collection = MediaStore.Video.Media.getContentUri(vol);
                      else if (mime.startsWith("image/")) collection = MediaStore.Images.Media.getContentUri(vol);
                      else collection = MediaStore.Downloads.getContentUri(vol);
                      ContentResolver r = c.getContentResolver();
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                      v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                      v.put(MediaStore.MediaColumns.RELATIVE_PATH, folder);
                      v.put(MediaStore.MediaColumns.IS_PENDING, 1);
                      Uri uri = r.insert(collection, v);
                      if (uri == null) throw new IOException("Android didn't let the app create the file");
                      try (InputStream in = new FileInputStream(f); OutputStream out = r.openOutputStream(uri)) {
                          if (out == null) throw new IOException("Couldn't write the file");
                          copy(in, out);
                      } catch (Exception e) {
                          try {
                              r.delete(uri, null, null);
                          } catch (Exception ignored) {
                          }
                          throw e;
                      }
                      v.clear();
                      v.put(MediaStore.MediaColumns.IS_PENDING, 0);
                      r.update(uri, v, null, null);
                      //noinspection ResultOfMethodCallIgnored
                      f.delete();
                      return U.obj("name", displayName(r, uri, name), "uri", uri.toString(), "mime", mime, "folder", folder, "bytes", bytes);
                  }

                  // Android 8 and 9: write the file directly (needs the storage permission).
                  File dest;
                  try {
                      File dir = new File(Environment.getExternalStoragePublicDirectory(top), folderName(c));
                      if (!dir.isDirectory() && !dir.mkdirs()) throw new IOException("No permission for " + folder);
                      dest = unique(dir, name);
                      copyFile(f, dest);
                  } catch (Exception e) {
                      File own = c.getExternalFilesDir(top);
                      if (own == null) throw e;
                      //noinspection ResultOfMethodCallIgnored
                      own.mkdirs();
                      dest = unique(own, name);
                      copyFile(f, dest);
                      folder = "Android/data/" + c.getPackageName() + "/files/" + top;
                  }
                  //noinspection ResultOfMethodCallIgnored
                  f.delete();
                  Uri uri = scan(c, dest, mime);
                  return U.obj("name", dest.getName(), "uri", uri == null ? "" : uri.toString(), "path", dest.getAbsolutePath(),
                          "mime", mime, "folder", folder, "bytes", bytes);
              }

              private static String displayName(ContentResolver r, Uri uri, String fallback) {
                  try (Cursor cur = r.query(uri, new String[]{MediaStore.MediaColumns.DISPLAY_NAME}, null, null, null)) {
                      if (cur != null && cur.moveToFirst()) {
                          String n = cur.getString(0);
                          if (n != null && !n.isEmpty()) return n;
                      }
                  } catch (Exception ignored) {
                  }
                  return fallback;
              }

              private static File unique(File dir, String name) {
                  File f = new File(dir, name);
                  if (!f.exists()) return f;
                  int dot = name.lastIndexOf('.');
                  String base = dot > 0 ? name.substring(0, dot) : name;
                  String ext = dot > 0 ? name.substring(dot) : "";
                  for (int i = 1; i < 1000; i++) {
                      f = new File(dir, base + " (" + i + ")" + ext);
                      if (!f.exists()) return f;
                  }
                  return new File(dir, base + " " + System.currentTimeMillis() + ext);
              }

              private static void copyFile(File from, File to) throws IOException {
                  if (from.renameTo(to)) return;
                  try (InputStream in = new FileInputStream(from); OutputStream out = new FileOutputStream(to)) {
                      copy(in, out);
                  }
              }

              private static void copy(InputStream in, OutputStream out) throws IOException {
                  byte[] buf = new byte[256 * 1024];
                  int n;
                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                  out.flush();
              }

              private static Uri scan(Context c, File f, String mime) {
                  final Uri[] got = new Uri[1];
                  final CountDownLatch done = new CountDownLatch(1);
                  MediaScannerConnection.scanFile(c, new String[]{f.getAbsolutePath()}, new String[]{mime}, (path, uri) -> {
                      got[0] = uri;
                      done.countDown();
                  });
                  try {
                      done.await(10, TimeUnit.SECONDS);
                  } catch (InterruptedException ignored) {
                  }
                  return got[0];
              }

              private static Uri uriOf(JSONObject f) {
                  if (f == null) return null;
                  String u = f.optString("uri");
                  return u.isEmpty() ? null : Uri.parse(u);
              }

              static boolean open(Activity a, JSONObject job) {
                  if (job == null) return false;
                  JSONArray files = job.optJSONArray("files");
                  JSONObject f = files == null ? null : files.optJSONObject(0);
                  Uri u = uriOf(f);
                  if (u == null) return false;
                  Intent i = new Intent(Intent.ACTION_VIEW);
                  i.setDataAndType(u, f.optString("mime", "*/*"));
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  try {
                      a.startActivity(i);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              static boolean share(Activity a, JSONObject job) {
                  if (job == null) return false;
                  JSONArray files = job.optJSONArray("files");
                  if (files == null) return false;
                  ArrayList<Uri> uris = new ArrayList<>();
                  String mime = null;
                  for (int i = 0; i < files.length(); i++) {
                      JSONObject f = files.optJSONObject(i);
                      Uri u = uriOf(f);
                      if (u == null) continue;
                      uris.add(u);
                      String m = f.optString("mime", "*/*");
                      if (mime == null) mime = m;
                      else if (!mime.equals(m)) {
                          String major = mime.split("/")[0];
                          mime = major.equals(m.split("/")[0]) ? major + "/*" : "*/*";
                      }
                  }
                  if (uris.isEmpty()) return false;
                  Intent i;
                  if (uris.size() == 1) {
                      i = new Intent(Intent.ACTION_SEND);
                      i.putExtra(Intent.EXTRA_STREAM, uris.get(0));
                  } else {
                      i = new Intent(Intent.ACTION_SEND_MULTIPLE);
                      i.putParcelableArrayListExtra(Intent.EXTRA_STREAM, uris);
                  }
                  i.setType(mime == null ? "*/*" : mime);
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  try {
                      a.startActivity(Intent.createChooser(i, null));
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              /** Deletes a job's files. Returns false if any couldn't be deleted. */
              static boolean delete(Context c, JSONObject job) {
                  JSONArray files = job == null ? null : job.optJSONArray("files");
                  if (files == null) return true;
                  boolean all = true;
                  for (int i = 0; i < files.length(); i++) {
                      JSONObject f = files.optJSONObject(i);
                      if (f == null) continue;
                      boolean ok = false;
                      try {
                          Uri u = uriOf(f);
                          if (u != null && "content".equals(u.getScheme())) ok = c.getContentResolver().delete(u, null, null) > 0;
                          String path = f.optString("path");
                          if (!ok && !path.isEmpty()) ok = new File(path).delete();
                      } catch (Exception ignored) {
                      }
                      all &= ok;
                  }
                  return all;
              }
          }
          EOF_JAVA5

